spring.application.name=library-spring
# =========================
# H2 In-Memory Database
# =========================
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================
# JPA / Hibernate
# =========================
# create / update schema automatically from your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# (Optional) Format SQL nicely in logs
spring.jpa.properties.hibernate.format_sql=true

# =========================
# H2 Console (to view DB in browser)
# =========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================
# Server Port (optional)
# =========================
server.port=8081